events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # เปิด CORS ให้ Frontend และ Backend ใช้งานได้
    add_header Access-Control-Allow-Origin ${FRONTEND_ORIGIN} always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, DELETE, PUT";
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";

    server {
        listen 80;
        server_name ${SERVER_NAME};

        client_max_body_size 50M;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /public/ {
            root /usr/share/nginx/html;
            autoindex off;
        }


        # Proxy ไปยัง Backend NestJS ที่รันบน Port 3000
        location /api/ {
            proxy_pass ${BACKEND_URL}/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";
        }



        # กำหนด MIME Type ให้ถูกต้องสำหรับ JavaScript และ CSS
        location ~* \.js$ {
            root /usr/share/nginx/html;
            types { application/javascript js; }
            add_header Content-Type application/javascript;
        }

        location ~* \.css$ {
            root /usr/share/nginx/html;
            types { text/css css; }
            add_header Content-Type text/css;
        }
        
        # ตั้งค่าการแคชไฟล์ static เพื่อลดการโหลดซ้ำ
        
        location ~ /\. {
            deny all;
        }
    }
}
